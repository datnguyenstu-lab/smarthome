<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Home</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#111827; --muted:#6b7280; --ok:#16a34a; --warn:#b45309; --warnbg:#fef3c7; --err:#b91c1c; --errbg:#fee2e2; --on:#16a34a; --line:#e5e7eb; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --ok:#34d399; --warn:#fcd34d; --warnbg:#78350f; --err:#fecaca; --errbg:#7f1d1d; --on:#34d399; --line:#374151; --accent:#60a5fa; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:420px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .dot.online { background:var(--ok); }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid var(--line); }
  .banner { border-radius:12px; padding:10px 12px; margin-bottom:12px; font-weight:600; }
  .banner.warn { background:var(--warnbg); color:var(--warn); }
  .banner.error { background:var(--errbg); color:var(--err); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .tiles .card { margin:0; }
  .label { color:var(--muted); font-size:13px; }
  .big { font-size:28px; font-weight:600; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .sw { appearance:none; width:50px; height:28px; border-radius:14px; background:var(--muted); position:relative; cursor:pointer; border:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s; }
  .sw.on { background:var(--on); } .sw.on::after { left:25px; }
  .sw:disabled { opacity:.4; cursor:not-allowed; }
  form { display:grid; gap:10px; }
  input { font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button.primary { font:inherit; padding:10px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-weight:600; }
  .error-text { color:var(--err); min-height:1.4em; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="login" class="card">
    <h1>Smart Home</h1>
    <form id="loginForm">
      <input id="user" placeholder="Username" autocomplete="username" required>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
      <p id="loginError" class="error-text" role="alert"></p>
      <button class="primary" id="loginBtn" type="submit">Connect</button>
    </form>
  </section>

  <section id="app" hidden>
    <header><h1>Smart Home</h1><span><span id="dot" class="dot"></span><span id="statusText">offline</span></span></header>
    <div id="banner" class="banner" hidden></div>
    <div class="tiles">
      <div class="card"><div class="label">Temperature</div><div id="temp" class="big">--</div></div>
      <div class="card"><div class="label">Presence</div><div id="presence" class="big">--</div><div id="age" class="label"></div></div>
    </div>
    <div class="card" id="switches">
      <div class="row"><span>Light 2</span><button class="sw" data-led="2" aria-label="Light 2"></button></div>
      <div class="row"><span>Light 3</span><button class="sw" data-led="3" aria-label="Light 3"></button></div>
      <div class="row"><span>Away mode</span><button class="sw" id="away" aria-label="Away mode"></button></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script type="module">
import { describeBanner, ageText, onOff } from './logic.js';

const BROKER = 'wss://hff38f13.ala.asia-southeast1.emqxsl.com:8084/mqtt';
const $ = (id) => document.getElementById(id);
const state = { status: undefined, temp: undefined, presence: undefined, presenceChanged: undefined, alert: 'none', away: false, led: { 1: false, 2: false, 3: false } };
let client = null, everConnected = false;

function render() {
  const online = state.status === 'online';
  $('dot').className = 'dot' + (online ? ' online' : '');
  $('statusText').textContent = online ? 'online' : 'offline';
  const b = describeBanner({ alert: state.alert, status: state.status });
  $('banner').hidden = b.level === 'ok';
  $('banner').className = 'banner ' + b.level;
  $('banner').textContent = b.text;
  $('temp').textContent = online && state.temp !== undefined ? `${state.temp}°C` : '--';
  $('presence').textContent = online && state.presence !== undefined ? (state.presence ? 'Someone' : 'Clear') : '--';
  $('age').textContent = online && state.presenceChanged ? 'last change: ' + ageText(Date.now() / 1000, state.presenceChanged) : '';
  for (const sw of document.querySelectorAll('.sw')) {
    const on = sw.id === 'away' ? state.away : state.led[sw.dataset.led];
    sw.classList.toggle('on', !!on);
    sw.setAttribute('aria-pressed', String(!!on));
    sw.disabled = !online;
  }
}

function handle(topic, buf) {
  const v = buf.toString();
  const t = topic.replace(/^smarthome\//, '');
  if (t === 'status') state.status = v;
  else if (t === 'temp') state.temp = v;
  else if (t === 'presence') state.presence = v === '1';
  else if (t === 'presence_changed') state.presenceChanged = Number(v);
  else if (t === 'alert') state.alert = v;
  else if (t === 'state/away') { const o = onOff(v); if (o !== null) state.away = o; }
  else if (t.startsWith('state/led')) { const o = onOff(v), n = t.slice(-1); if (o !== null && state.led[n] !== undefined) state.led[n] = o; }
  render();
}

function connect(username, password) {
  $('loginError').textContent = '';
  $('loginBtn').disabled = true;
  everConnected = false;
  client = mqtt.connect(BROKER, { username, password, clientId: 'web-' + Math.random().toString(16).slice(2, 10), keepalive: 30, reconnectPeriod: 3000, connectTimeout: 10000 });
  client.on('connect', () => {
    everConnected = true;
    client.subscribe('smarthome/#');
    $('login').hidden = true; $('app').hidden = false;
    $('pass').value = '';
    render();
  });
  client.on('message', handle);
  client.on('error', (e) => { if (!everConnected) fail(e); });
  client.on('close', () => { if (everConnected) { state.status = undefined; render(); } });
  setTimeout(() => { if (!everConnected) fail(); }, 12000);
}

function fail() {
  if (client) { client.end(true); client = null; }
  $('loginError').textContent = 'Login failed. Check your username and password.';
  $('loginBtn').disabled = false;
}

$('loginForm').addEventListener('submit', (e) => { e.preventDefault(); connect($('user').value, $('pass').value); });

document.querySelectorAll('.sw[data-led]').forEach((sw) => sw.addEventListener('click', () => {
  const n = sw.dataset.led;
  client.publish(`smarthome/cmd/led${n}`, state.led[n] ? 'off' : 'on');
}));
$('away').addEventListener('click', () => client.publish('smarthome/cmd/away', state.away ? 'off' : 'on', { retain: true }));
setInterval(() => { if (!$('app').hidden) render(); }, 30000);
</script>
</body>
</html>
